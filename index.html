<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8a1218">
  <title>amoeba — sawadika</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="home">
  <main class="page">
    <img
      class="header-img"
      src="assets/hero.jpg"
      alt="Imagem principal"
    >

    <section class="row" aria-label="Conteúdo principal">
      <a class="thumb" href="sobre-1.html" aria-label="Conheça mais sobre Amoeba">
        <img src="assets/foto-1.jpg" alt="Foto 1">
      </a>

      <a class="thumb" href="sobre-2.html" aria-label="Veja curiosidades">
        <img src="assets/foto-2.jpg" alt="Foto 2">
      </a>

      <div class="vinyl-block">
        <img
          class="vinyl"
          id="vinyl"
          src="assets/vinyl.png"
          alt="Vinil da Sawadika"
        >
      </div>
    </section>

    <button class="play-btn" id="playBtn" type="button">
      PRESS PLAY
    </button>
  </main>

  <div class="modal" id="videoModal" aria-hidden="true">
    <div class="modal__backdrop" id="modalBackdrop"></div>

    <div
      class="modal__box"
      role="dialog"
      aria-modal="true"
      aria-label="Vídeo"
    >
      <button class="modal__close" id="modalClose" type="button" aria-label="Fechar vídeo">
        ✕
      </button>

      <video id="modalVideo" controls playsinline preload="metadata">
        <source src="assets/video.mp4" type="video/mp4">
        Seu navegador não consegue reproduzir este vídeo.
      </video>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
